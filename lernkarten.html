<style>
/* Layout: eine schmale Spalte. Oben Themenfilter, in der Mitte eine große Karte zum Umdrehen, darunter die Bedienung. */
:root {
  --bg: #EDF3F2;
  --surface: #FFFFFF;
  --ink: #0E2A2D;
  --muted: #566F70;
  --line: #CBDAD8;
  --chip: #DCE8E6;
  --tint: #D3EBE8;
  --accent: #0B7F78;
  --accent-ink: #FFFFFF;
  --accent-strong: #07605A;
  --back: #0D3D40;
  --back-ink: #E8F5F3;
  --back-muted: #9CC3C0;
  --back-mark: #F0B94D;
  --ok: #17784A;
  --ok-ink: #FFFFFF;
  --again: #A8481F;
  --font-display: 'Bricolage Grotesque', 'Atkinson Hyperlegible', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1517; --surface: #122326; --ink: #E6F2F0; --muted: #93AEAC; --line: #26403F;
    --chip: #1B3235; --tint: #1A3B3B; --accent: #3FC1B6; --accent-ink: #05201E; --accent-strong: #7ADCD2;
    --back: #14504F; --back-ink: #EAF7F5; --back-muted: #9FCBC7; --back-mark: #F0B94D;
    --ok: #52C98A; --ok-ink: #062A18; --again: #F0A070;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1517; --surface: #122326; --ink: #E6F2F0; --muted: #93AEAC; --line: #26403F;
  --chip: #1B3235; --tint: #1A3B3B; --accent: #3FC1B6; --accent-ink: #05201E; --accent-strong: #7ADCD2;
  --back: #14504F; --back-ink: #EAF7F5; --back-muted: #9FCBC7; --back-mark: #F0B94D;
  --ok: #52C98A; --ok-ink: #062A18; --again: #F0A070;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 18px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.app { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; hyphens: auto; }
.app > * { min-width: 0; }

.top h1 { font-family: var(--font-display); font-size: 29px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
.top .sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.countdown { display: inline-block; margin: 10px 0 0; padding: 5px 12px; border-radius: 999px; background: var(--tint); color: var(--accent-strong); font-weight: 700; font-size: 14px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid transparent; background: var(--chip); font-weight: 700; font-size: 14px; }
.chip .n { margin-left: 6px; opacity: 0.65; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tool { min-height: 40px; padding: 7px 13px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
.tool[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); color: var(--accent-strong); }
.tool.quiet { border-color: transparent; color: var(--muted); margin-left: auto; }

.progress { display: grid; gap: 6px; }
.prow { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--ok); transition: width 0.3s ease; }

.card { perspective: 1400px; cursor: pointer; border-radius: 22px; }
.inner { display: grid; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.2, 0.75, 0.2, 1); }
.card.flipped .inner { transform: rotateY(180deg); }
.card.noanim .inner { transition: none; }
.card.enter { animation: enter 0.28s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.face { grid-area: 1 / 1; min-height: 360px; display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 18px; border-radius: 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.front { background: var(--surface); border: 1px solid var(--line); box-shadow: 0 22px 40px -30px rgba(8, 45, 48, 0.5); }
.back { background: var(--back); color: var(--back-ink); transform: rotateY(180deg); }

.face-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.pill { padding: 5px 11px; border-radius: 999px; background: var(--tint); color: var(--accent-strong); font-weight: 700; font-size: 13px; letter-spacing: 0.02em; max-width: 100%; }
.back .pill { background: rgba(255, 255, 255, 0.13); color: var(--back-ink); }
.count { flex: none; padding-top: 4px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.back .count { color: var(--back-muted); }
.tick { color: var(--ok); font-weight: 700; margin-left: 6px; }
.back .tick { color: var(--back-mark); }

.q { flex: 1; display: flex; align-items: center; margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(23px, 6.4vw, 30px); line-height: 1.18; text-wrap: balance; letter-spacing: -0.005em; overflow-wrap: break-word; }
.hint { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.back .hint { color: var(--back-muted); }

.ans { flex: 1; font-size: 17px; line-height: 1.45; overflow-wrap: break-word; }
.ans .lead { margin: 0 0 12px; }
.ans ul, .ans ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ans ol { counter-reset: step; }
.ans li { position: relative; padding-left: 22px; }
.ans ul li::before { content: ""; position: absolute; left: 3px; top: 0.62em; width: 7px; height: 7px; border-radius: 50%; background: var(--back-mark); }
.ans ol li { padding-left: 28px; }
.ans ol li::before { counter-increment: step; content: counter(step); position: absolute; left: 0; top: 0; font-weight: 700; color: var(--back-mark); font-variant-numeric: tabular-nums; }
.ans strong { font-weight: 700; color: var(--back-mark); }

.controls { display: grid; grid-template-columns: 52px 1fr 1fr 52px; gap: 10px; }
.nav, .mark { min-height: 52px; border-radius: 16px; }
.nav { border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.mark { border: 2px solid; font-weight: 700; font-size: 16px; }
.mark.again { border-color: var(--again); color: var(--again); background: transparent; }
.mark.ok { border-color: var(--ok); background: var(--ok); color: var(--ok-ink); }

.empty { padding: 28px 22px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 12px; justify-items: start; }
.empty h2 { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 1.2; }
.empty p { margin: 0; color: var(--muted); }

.foot { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

@media (hover: hover) {
  .chip:not([aria-pressed="true"]):hover, .tool:hover, .nav:hover { border-color: var(--accent); }
}
@media (prefers-reduced-motion: reduce) {
  .inner { transition: none; }
  .card.enter { animation: none; }
  .bar i { transition: none; }
}
</style>

<main class="app" lang="de">
  <header class="top">
    <h1>Lernkarten</h1>
    <p class="sub">Gesundheits- und Krankenpflegehilfe · 1. Performanceprüfung</p>
    <p class="countdown" id="countdown" hidden></p>
  </header>

  <div class="chips" id="chips" aria-label="Thema wählen"></div>

  <div class="tools">
    <button class="tool" id="shuffle" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
      Mischen
    </button>
    <button class="tool" id="onlyOpen" type="button" aria-pressed="false">Nur offene</button>
    <button class="tool quiet" id="reset" type="button">Zurücksetzen</button>
  </div>

  <div class="progress" aria-live="polite">
    <div class="prow"><span id="progText"></span><span id="progPct"></span></div>
    <div class="bar"><i id="barFill"></i></div>
  </div>

  <section id="stage">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Karte umdrehen">
      <div class="inner">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
  </section>

  <div class="controls" id="controls">
    <button class="nav" id="prev" type="button" aria-label="Vorherige Karte">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <button class="mark again" id="again" type="button">Nochmal</button>
    <button class="mark ok" id="ok" type="button">Gewusst</button>
    <button class="nav" id="next" type="button" aria-label="Nächste Karte">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
    </button>
  </div>

  <section class="empty" id="empty" hidden>
    <h2>Alles gewusst in diesem Bereich.</h2>
    <p>Du hast alle Karten hier mit „Gewusst“ markiert.</p>
    <button class="tool" id="showAll" type="button">Alle Karten zeigen</button>
  </section>

  <p class="foot">Die Antworten sind eine Lernhilfe. Prüfungsinhalte stehen in deinem Skript.</p>
</main>

<script>
(function () {
  var TOPICS = [
    { s: "Hygiene", l: "Händehygiene und Flächendesinfektion" },
    { s: "Puls", l: "Puls" },
    { s: "Blutdruck", l: "Blutdruck" },
    { s: "Körperpflege", l: "Körperpflege" },
    { s: "Dekubitus", l: "Dekubitusprophylaxe, Hautpflege" }
  ];
  function C(t, q, a, o) { var c = { t: t, q: q, a: a }; if (o) { for (var k in o) c[k] = o[k]; } return c; }

  var CARDS = [
    /* ---------- Händehygiene und Flächendesinfektion ---------- */
    C(0, "Welche Ziele hat die Händedesinfektion?", [
      "Krankheitserreger (Keime) auf den Händen abtöten",
      "Keine Infektionen weitergeben: von Patient zu Patient, vom Patienten zum Personal und umgekehrt",
      "Patienten und sich selbst schützen",
      "Infektionen im Krankenhaus oder Pflegeheim verhindern"
    ]),
    C(0, "Welche 5 Momente der Händedesinfektion gibt es?", [
      "**Vor** dem Patientenkontakt",
      "**Vor** einer sauberen (aseptischen) Tätigkeit",
      "**Nach** Kontakt mit Körperflüssigkeiten",
      "**Nach** dem Patientenkontakt",
      "**Nach** Kontakt mit der Patientenumgebung"
    ], { n: true }),
    C(0, "Nenne Beispiele für die 5 Momente.", [
      "**Vor Patientenkontakt:** vor der Körperpflege, vor dem Blutdruckmessen",
      "**Vor sauberer Tätigkeit:** vor dem Verbandwechsel, vor einer Injektion",
      "**Nach Körperflüssigkeiten:** nach Kontakt mit Urin, Stuhl, Blut oder Erbrochenem (auch nach dem Ausziehen der Handschuhe)",
      "**Nach Patientenkontakt:** nach der Körperpflege, nach dem Pulsmessen",
      "**Nach Patientenumgebung:** nach dem Anfassen von Bett, Nachttisch oder Bettgitter"
    ], { n: true }),
    C(0, "Wie führe ich die Händedesinfektion richtig durch?", [
      "Schmuck, Uhr und Armbänder vorher ablegen",
      "Mittel in die **trockenen** Hände geben (ca. 3 ml)",
      "**30 Sekunden** einreiben (Herstellerangabe beachten)",
      "Handflächen, Handrücken, Fingerzwischenräume, Daumen und Fingerspitzen nicht vergessen",
      "Die Hände müssen die ganze Zeit **feucht** bleiben",
      "Lufttrocknen lassen, nicht abwischen"
    ]),
    C(0, "Welche Arten der Flächendesinfektion gibt es?", [
      "**Laufende Desinfektion:** jeden Tag, im normalen Alltag",
      "**Gezielte Desinfektion:** sofort, wenn etwas verschmutzt ist (z.B. Blut, Stuhl, Urin)",
      "**Schlussdesinfektion:** nach Entlassung, Verlegung oder am Ende einer Isolation",
      "**Wischdesinfektion:** mit einem Tuch, das mit Desinfektionsmittel getränkt ist (Standard)",
      "**Sprühdesinfektion:** nur, wenn Wischen nicht möglich ist"
    ]),
    C(0, "Welche Flächen müssen täglich desinfiziert werden?", [
      "Nachttisch und Bettgitter",
      "Bettbedienung, Notrufklingel, Lichtschalter",
      "Türklinken und Handläufe",
      "Waschbecken, Toilette und Armaturen im Bad",
      "Arbeitsflächen, z.B. am Pflegewagen",
      "Genaue Liste: im **Hygieneplan** der Einrichtung"
    ], { lead: "Alle Flächen, die oft mit den Händen berührt werden:" }),
    C(0, "Warum muss man die Einwirkzeit beachten?", [
      "Das Desinfektionsmittel braucht Zeit, um die Keime abzutöten.",
      "Wird die Fläche zu früh trockengewischt, bleiben Keime übrig.",
      "Die Einwirkzeit steht auf der Flasche."
    ]),

    /* ---------- Puls ---------- */
    C(1, "Was ist der Puls?", [
      "Der Puls ist die **Pulswelle**, die man an einer Arterie fühlen kann.",
      "Bei jedem Herzschlag drückt das Herz Blut in die Arterien.",
      "Man beurteilt: wie oft pro Minute (Frequenz), wie regelmäßig (Rhythmus), wie kräftig (Qualität)."
    ]),
    C(1, "Wie entsteht die Pulswelle?", [
      "Das Herz zieht sich zusammen (**Systole**) und wirft Blut in die Hauptschlagader (Aorta).",
      "Die Wand der Arterie wird vom Blut kurz gedehnt.",
      "Diese Dehnung läuft als **Welle** durch alle Arterien.",
      "An Stellen nahe der Haut kann man die Welle mit den Fingern spüren."
    ], { n: true }),
    C(1, "Wann misst man den Puls? (Indikationen)", [
      "Bei der Aufnahme und bei der Routinekontrolle",
      "Vor und nach einer Operation",
      "Bei Herz- und Kreislauferkrankungen",
      "Bei Fieber, Schmerzen, Angst, Unruhe oder Atemnot",
      "Bei Schwindel oder Verdacht auf Schock",
      "Nach bestimmten Medikamenten (z.B. Herzmedikamente)",
      "Nach Belastung, z.B. nach dem Aufstehen",
      "Wenn der Arzt es anordnet"
    ]),
    C(1, "Was ist eine Bradykardie?", [
      "Ein **zu langsamer** Puls.",
      "Weniger als **60 Schläge pro Minute** (Erwachsene).",
      "Bei trainierten Sportlern kann das normal sein."
    ]),
    C(1, "Was ist eine Tachykardie?", [
      "Ein **zu schneller** Puls.",
      "Mehr als **100 Schläge pro Minute** in Ruhe (Erwachsene).",
      "Mögliche Ursachen: Fieber, Schmerzen, Aufregung, Blutverlust, Herzerkrankung."
    ]),
    C(1, "Was ist eine Arrhythmie?", [
      "Ein **unregelmäßiger** Puls.",
      "Die Abstände zwischen den Pulsschlägen sind nicht gleich.",
      "Beispiel: Vorhofflimmern.",
      "Bei Unregelmäßigkeit zähle ich **eine ganze Minute**."
    ]),
    C(1, "Was ist ein Pulsdefizit?", [
      "Der Unterschied zwischen den **Herzschlägen** (am Herzen gehört) und den **Pulsschlägen** (am Handgelenk gefühlt).",
      "Der Puls ist dann niedriger als der Herzschlag.",
      "Grund: Manche Herzschläge sind zu schwach und kommen nicht bis zum Handgelenk.",
      "Zum Beispiel bei Vorhofflimmern."
    ]),
    C(1, "Was ist eine Asystolie?", [
      "**Herzstillstand:** Das Herz schlägt nicht mehr.",
      "Es ist kein Puls tastbar.",
      "Das ist ein **Notfall**: sofort Hilfe holen und nach Anweisung handeln."
    ]),
    C(1, "Welche Normwerte hat der Puls?", [
      "Neugeborene und Säuglinge: ca. **120–140**",
      "Kleinkinder: ca. **100–120**",
      "Schulkinder: ca. **80–100**",
      "Erwachsene: **60–80** (bis 100 noch im Normbereich)",
      "Je jünger, desto schneller der Puls."
    ], { lead: "Pulsfrequenz in Ruhe, Schläge pro Minute:" }),
    C(1, "Warum schwankt der Puls normalerweise? (physiologisch)", [
      "**Alter:** Kinder haben einen schnelleren Puls",
      "**Geschlecht:** bei Frauen etwas schneller",
      "**Bewegung und Stress:** Puls steigt",
      "**Aufregung, Angst, Freude:** Puls steigt",
      "**Schlaf und Ruhe:** Puls sinkt",
      "**Wärme, Essen, Tageszeit:** Puls kann etwas steigen",
      "**Sportler:** Ruhepuls oft niedriger"
    ]),
    C(1, "Welche krankhaften Ursachen verändern den Puls? (pathologisch)", [
      "Fieber: Puls steigt (ca. 10 Schläge pro 1 °C)",
      "Schmerzen, Blutverlust, Schock: Puls steigt",
      "Herzerkrankungen, z.B. Herzschwäche oder Rhythmusstörungen",
      "Schilddrüsen-Überfunktion: Puls schnell",
      "Schilddrüsen-Unterfunktion: Puls langsam",
      "Bestimmte Medikamente, z.B. Betablocker: Puls sinkt",
      "Erhöhter Hirndruck: Puls kann sinken"
    ]),
    C(1, "Wo misst man den Puls?", [
      "Hals (Arteria carotis)",
      "Oberarm (Arteria brachialis)",
      "Schläfe (Arteria temporalis)",
      "Leiste (Arteria femoralis)",
      "Kniekehle (Arteria poplitea)",
      "Fußrücken (Arteria dorsalis pedis)",
      "Innenknöchel (Arteria tibialis posterior)"
    ], { lead: "**Regelmäßig:** am Handgelenk, Daumenseite (Arteria radialis). **Seltener:**" }),
    C(1, "Was beobachte ich beim Puls? (Beobachtungskriterien)", [
      "**Frequenz:** Wie viele Schläge pro Minute?",
      "**Rhythmus:** regelmäßig oder unregelmäßig?",
      "**Qualität:** hart oder weich?",
      "**Füllung:** voll, schwach oder fadenförmig?",
      "**Seitenvergleich:** auf beiden Seiten gleich?"
    ]),
    C(1, "Was bedeuten harter, weicher und fadenförmiger Puls?", [
      "**Harter Puls:** Die Arterie lässt sich schwer zudrücken. Oft bei hohem Blutdruck.",
      "**Weicher Puls:** Die Arterie lässt sich leicht zudrücken. Oft bei niedrigem Blutdruck.",
      "**Fadenförmiger Puls:** sehr schwach, kaum tastbar, oft schnell. Zeichen für Schock. Sofort melden."
    ]),
    C(1, "Wie messe ich den Puls Schritt für Schritt?", [
      "Hände desinfizieren, Patienten informieren",
      "Patient liegt oder sitzt bequem, etwa 5 Minuten Ruhe",
      "Arm locker lagern, Handfläche nach oben",
      "Zeige-, Mittel- und Ringfinger leicht auf die Arteria radialis legen",
      "**Nicht den Daumen** benutzen, er hat einen eigenen Puls",
      "30 Sekunden zählen und mal 2 rechnen. Bei Arrhythmie **1 ganze Minute** zählen",
      "Frequenz, Rhythmus und Qualität beobachten",
      "Hände desinfizieren, Wert dokumentieren"
    ], { n: true }),

    /* ---------- Blutdruck ---------- */
    C(2, "Was ist der Blutdruck?", [
      "Der Druck, mit dem das Blut gegen die Wand der **Arterien** drückt.",
      "Er entsteht durch den Herzschlag.",
      "Einheit: **mmHg** (Millimeter Quecksilbersäule).",
      "**Systolisch** (oberer Wert): Das Herz zieht sich zusammen.",
      "**Diastolisch** (unterer Wert): Das Herz entspannt sich."
    ]),
    C(2, "Was ist eine Hypertonie?", [
      "Zu **hoher** Blutdruck.",
      "Ab **140/90 mmHg**, wenn mehrfach gemessen.",
      "Oft keine Beschwerden. Darum regelmäßig messen.",
      "Manchmal: Kopfschmerzen, Schwindel."
    ]),
    C(2, "Was ist eine Hypotonie?", [
      "Zu **niedriger** Blutdruck.",
      "Unter **100/60 mmHg**.",
      "Zeichen: Schwindel, Müdigkeit, Schwarzwerden vor den Augen, kalte Hände.",

  /* ---------- Zustand ---------- */
  var KEY = "pflegehilfe-lernkarten-v1";
  var known = {};
  try { var raw = localStorage.getItem(KEY); if (raw) { JSON.parse(raw).forEach(function (q) { known[q] = true; }); } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(Object.keys(known))); } catch (e) {} }

  var topic = -1, onlyOpen = false, shuffled = false, deck = [], pos = 0, flipped = false;

  var $ = function (id) { return document.getElementById(id); };
  var card = $("card"), front = $("front"), back = $("back");

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
  function shuffleArr(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function inScope() { return CARDS.filter(function (c) { return topic < 0 || c.t === topic; }); }

  function build() {
    var list = inScope().filter(function (c) { return !onlyOpen || !known[c.q]; });
    deck = shuffled ? shuffleArr(list.slice()) : list;
    pos = 0; flipped = false;
  }

  /* ---------- Chips ---------- */
  function renderChips() {
    var box = $("chips"); box.innerHTML = "";
    var items = [{ i: -1, label: "Alle", n: CARDS.length }];
    TOPICS.forEach(function (t, i) { items.push({ i: i, label: t.s, n: CARDS.filter(function (c) { return c.t === i; }).length }); });
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", String(topic === it.i));
      b.innerHTML = esc(it.label) + '<span class="n">' + it.n + "</span>";
      b.addEventListener("click", function () { topic = it.i; build(); renderChips(); render(true); });
      box.appendChild(b);
    });
  }

  /* ---------- Karte ---------- */
  function answerHtml(c) {
    var tag = c.n ? "ol" : "ul";
    var h = c.lead ? '<p class="lead">' + fmt(c.lead) + "</p>" : "";
    return h + "<" + tag + ">" + c.a.map(function (x) { return "<li>" + fmt(x) + "</li>"; }).join("") + "</" + tag + ">";
  }
  var FLIP_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>';

  function renderProgress() {
    var scope = inScope(), k = scope.filter(function (c) { return known[c.q]; }).length;
    var pct = scope.length ? Math.round(k / scope.length * 100) : 0;
    $("progText").textContent = "Gewusst: " + k + " von " + scope.length;
    $("progPct").textContent = pct + " %";
    $("barFill").style.width = pct + "%";
  }

  function render(fresh) {
    renderProgress();
    var has = deck.length > 0;
    $("stage").hidden = !has; $("controls").hidden = !has; $("empty").hidden = has;
    if (!has) return;
    var c = deck[pos], isKnown = !!known[c.q];
    var count = (pos + 1) + " / " + deck.length + (isKnown ? '<span class="tick">✓ Gewusst</span>' : "");
    var pill = '<span class="pill">' + esc(TOPICS[c.t].l) + "</span>";
    front.innerHTML = '<div class="face-top">' + pill + '<span class="count">' + count + "</span></div>" +
      '<h2 class="q">' + esc(c.q) + "</h2>" +
      '<div class="hint">' + FLIP_ICON + "<span>Antippen für die Antwort</span></div>";
    back.innerHTML = '<div class="face-top">' + pill + '<span class="count">' + count + "</span></div>" +
      '<div class="ans">' + answerHtml(c) + "</div>" +
      '<div class="hint">' + FLIP_ICON + "<span>Antippen für die Frage</span></div>";
    if (fresh) {
      card.classList.add("noanim");
      card.classList.remove("flipped");
      void card.offsetWidth;
      card.classList.remove("noanim");
      card.classList.remove("enter"); void card.offsetWidth; card.classList.add("enter");
    }

  function setFlip(f) {
    flipped = f;

    front.setAttribute("aria-hidden", String(f));
    back.setAttribute("aria-hidden", String(!f));
    card.setAttribute("aria-label", f ? "Karte umdrehen, Frage zeigen" : "Karte umdrehen, Antwort zeigen");

  function go(d) {
    if (!deck.length) return;
    pos = (pos + d + deck.length) % deck.length; flipped = false; render(true);
  }
  function mark(isKnown) {
    if (!deck.length) return;
    var c = deck[pos];
    if (isKnown) known[c.q] = true; else delete known[c.q];
    save();
    if (onlyOpen && isKnown) { deck.splice(pos, 1); if (pos >= deck.length) pos = 0; }
    else { pos = (pos + 1) % deck.length; }
    flipped = false; render(true);
  }

  /* ---------- Bedienung ---------- */
  card.addEventListener("click", function () { setFlip(!flipped); });
  card.addEventListener("keydown", function (e) {

  document.addEventListener("keydown", function (e) {

  $("prev").addEventListener("click", function () { go(-1); });
  $("next").addEventListener("click", function () { go(1); });
  $("again").addEventListener("click", function () { mark(false); });

  /* ---------- Countdown bis zur Prüfung ---------- */
  (function () {
    var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    else if (days === 0) { el.textContent = "Heute ist die Prüfung. Viel Erfolg!"; el.hidden = false; }

  build(); renderChips(); render(true);
